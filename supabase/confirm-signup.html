<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Confirm your GameSense Lab email</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #080908;
      color: #f0f0eb;
      font-family: Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      style="
        max-width: 560px;
        width: 100%;
        margin: auto;
        background: #12160f;
        border: 1px solid #504326;
        padding: 32px;
      "
    >
      <tr>
        <td>
          <p style="color: #d6ad60; letter-spacing: 3px; font-size: 13px">GAMESENSE LAB</p>
          <h1 style="font-size: 30px">Confirm your email.</h1>
          <p style="color: #c5cabc; line-height: 1.7">
            Confirm your email address to finish setting up your GameSense Lab account.
          </p>
          <p style="margin: 30px 0">
            <a
              href="{{ .ConfirmationURL }}"
              style="
                display: inline-block;
                background: #d6ad60;
                color: #080908;
                padding: 16px 24px;
                text-decoration: none;
                font-weight: bold;
              "
              >VERIFY MY EMAIL</a
            >
          </p>
          <p style="color: #a0a39b; font-size: 13px; line-height: 1.7">
            Open this link in the same browser where you signed up. If you didn’t request an
            account, you can ignore this email.
          </p>
          <p style="color: #d6ad60; font-size: 12px; margin-top: 30px">PLAY SMARTER.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
