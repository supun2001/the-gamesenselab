name: Validate Altheia
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
# Deploy the repository using Cloudflare Pages Git integration.
# GitHub Pages cannot run the server endpoints and must not host the production forms.
